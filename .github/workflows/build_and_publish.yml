name: Build and publish HTML and PDF documentation

on:
  release:
    types:
      created

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: latest

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen --no-dev

    - name: Build documentation
      run: |
        make html
        make latex

    - name: Upload HTML to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: html
        path: build/html

    - name: Compile PDF
      uses: xu-cheng/latex-action@v4
      with:
        root_file: ndigo5g-10userguide.tex
        latexmk_use_lualatex: true
        working_directory: build/latex

    - name: Upload log if latexmk fails
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: latex_files
        path: |
          build/latex/*

    - name: Rename latex file
      run: |
        mv build/latex/ndigo5g-10userguide.pdf build/latex/Ndigo5G_User_Guide.pdf

    - name: Upload LaTeX to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: latex
        path: build/latex

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: main

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Publish HTML
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        source: ./artifacts/html/*
        target: ${{ secrets.TARGETHTML }}
        strip_components: 2
        rm: true

    - name: Publish PDF
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.KEY }}
        source: ./artifacts/latex/Ndigo5G_User_Guide.pdf
        target: ${{ secrets.TARGETPDF }}
        strip_components: 3
        rm: true

    - name: zip documentation
      run: |
        mkdir documentation
        mv ./artifacts/html ./documentation/html
        mv ./artifacts/latex/Ndigo5G_User_Guide.pdf ./documentation/Ndigo5G_User_Guide.pdf
        (cd documentation && zip -r ../documentation.zip .)

    - name: Upload documentation as release asset
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} ./documentation.zip
